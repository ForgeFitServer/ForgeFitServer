name: forge-fitness-server

services:
  media:
    image: alpine/git
    volumes:
      - ./media/img:/out/img
      - ./media/gif:/out/gif
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -z "$$(ls -A /out/img 2>/dev/null)" ]; then
          echo "↓ Downloading exercise media (~140 MB, one time)…"
          git clone --depth 1 https://github.com/hasaneyldrm/exercises-dataset /tmp/ds
          cp /tmp/ds/images/*.jpg /out/img/ && cp /tmp/ds/videos/*.gif /out/gif/
          echo "✓ Exercise media ready ($$(ls /out/img | wc -l) images)."
        else
          echo "✓ Exercise media already present — skipping download."
        fi
    restart: "no"

  api:
    build: ./App/api
    restart: unless-stopped
    environment:
      - RP_ID=${RP_ID:-localhost}
      - ORIGIN=${ORIGIN:-http://localhost:8080}
      - RP_NAME=${RP_NAME:-Forge Fitness Server}
      - BRAND_NAME=${BRAND_NAME:-Forge Fitness Server}
      - AUTH_MODE=${AUTH_MODE:-all}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-to-a-long-random-string}
      - INVITE_ONLY=${INVITE_ONLY:-false}
    volumes:
      - ./data:/data         # users, passkeys, per-user state, session secret — BACK THIS UP
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: ./App
      dockerfile: web/Dockerfile
      args:
        - AUTH_MODE=${AUTH_MODE:-all}
        - BRAND_NAME=${BRAND_NAME:-Forge Fitness Server}
    restart: unless-stopped
    depends_on:
      media:
        condition: service_completed_successfully
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - ./media/img:/usr/share/nginx/html/img:ro
      - ./media/gif:/usr/share/nginx/html/gif:ro
    security_opt:
      - no-new-privileges:true
